[versions]
agp = "9.4.1"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.10.0"
kotlin = "2.4.21"
animalSniffer = "2.0.1"
androidApi31Signature = "12_r1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
agpGradleApi = { group = "com.android.tools.build", name = "gradle-api", version.ref = "agp" }
# Build-time only (Animal Sniffer `signature` configuration); never on a runtime classpath.
# camelCase on purpose: a bare `android` first segment collides with the `android` extension.
androidApi31Signature = { group = "net.sf.androidscents.signature", name = "android-api-level-31", version.ref = "androidApi31Signature" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
animalsniffer = { id = "ru.vyarus.animalsniffer", version.ref = "animalSniffer" }
